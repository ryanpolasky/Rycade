<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:,">
    <title>RYCADE · Game Library</title>
    <link rel="stylesheet" href="vendor/fonts/fonts.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="features.css">
    <link rel="stylesheet" href="themes/cover-flow.css">
    <link rel="stylesheet" href="themes/shelf.css">
    <link rel="stylesheet" href="themes/studio.css">
  </head>
  <body data-theme="cover-flow">
    <main id="stage">
      <div class="bg" aria-hidden="true">
        <div class="pair" id="backdrop">
          <img class="active" alt="">
          <img alt="">
        </div>
      </div>
      <div class="dim" aria-hidden="true"></div>
      <div class="spill" aria-hidden="true"></div>
      <div id="theme-layout" aria-hidden="true"></div>

      <header class="mq" aria-label="Selected game">
        <img id="mlogo" alt="">
        <span id="mtext"></span>
      </header>

      <section class="lb" aria-label="Game flyer">
        <div class="in pair" id="flyer">
          <img class="active" alt="">
          <img alt="">
        </div>
      </section>

      <button id="monitor" class="mon" type="button" aria-label="Launch selected game">
        <div class="s pair" id="screen">
          <img class="active" alt="">
          <img alt="">
          <span id="now-playing">NOW PLAYING · ESC TO EXIT</span>
        </div>
      </button>

      <header class="topbar">
        <div class="wm">RYCADE <span id="clock" aria-label="Current time"></span><button id="settings-open" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12m9.9 9.9 2.12 2.12m0-14.14-2.12 2.12m-9.9 9.9-2.12 2.12"/><circle cx="12" cy="12" r="4"/></svg></button></div>
        <div class="topbar-tabs">
          <button id="search-open" type="button" aria-label="Search games"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
          <nav id="tabs" class="tabs" aria-label="Game system"></nav>
        </div>
      </header>
      <section id="roster" class="roster" aria-label="Games">
        <div id="list"></div>
      </section>

      <section class="cap" aria-live="polite">
        <h1 id="title"></h1>
        <p id="sub"></p>
      </section>

      <div id="controls" class="ctl" aria-label="Game controls"></div>
      <div class="hint"><b>HOLD ▲▼</b> skim &nbsp; <b>SHOOT</b> play</div>
      <div id="letter" class="letter" aria-hidden="true">
        <b></b>
        <small>JUMP BY LETTER</small>
      </div>
      <section id="search-overlay" class="feature-overlay" aria-label="Search games" aria-hidden="true">
        <div class="feature-panel search-panel">
          <header class="feature-heading">
            <div><small>RYCADE · LIBRARY</small><h2>SEARCH</h2></div>
            <button id="search-close" class="panel-close" type="button" aria-label="Close search">×</button>
          </header>
          <input id="search-query" type="text" autocomplete="off" placeholder="SEARCH TITLES OR SYSTEMS" aria-label="Search games">
          <div class="search-workspace">
            <div class="keyboard-column">
              <div id="search-keyboard" class="search-keyboard" aria-label="On-screen keyboard"></div>
              <div class="feature-help">STICK MOVES · SHOOT SELECTS · DONE CLOSES</div>
            </div>
            <div class="results-column">
              <div id="search-results" class="search-results" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </section>
      <section id="settings-overlay" class="feature-overlay" aria-label="Settings" aria-hidden="true">
        <div class="feature-panel settings-panel">
          <header class="feature-heading">
            <div><small>RYCADE · CONFIGURATION</small><h2>SETTINGS</h2></div>
          </header>
          <div class="settings-workspace">
            <nav id="settings-nav" class="settings-nav" aria-label="Settings sections"></nav>
            <div id="settings-content" class="settings-content"></div>
          </div>
          <footer class="settings-footer">▲▼ move · ▶ open · SHOOT select · ◀ back / close</footer>
        </div>
      </section>
      <div id="remote-toast" class="remote-toast" role="status" aria-live="polite"></div>
      <section id="attract-overlay" aria-label="Attract mode" hidden>
        <video playsinline muted preload="none" disablepictureinpicture></video>
        <img class="attract-still" alt="Gameplay preview">
        <div class="attract-card">
          <div class="attract-copy">
            <img class="attract-logo" alt="">
            <h1 class="attract-title"></h1>
            <span class="attract-players"></span>
          </div>
          <div class="attract-prompt"><b>PRESS START</b><small>ANY INPUT TO BROWSE</small></div>
        </div>
      </section>
      <section id="demo-overlay" class="demo-overlay" role="dialog" aria-modal="true" aria-label="Game demo" aria-hidden="true" tabindex="-1" hidden>
        <video id="demo-video" playsinline loop preload="none" disablepictureinpicture></video>
        <div class="demo-hud attract-card">
          <div class="attract-copy">
            <img class="attract-logo" alt="">
            <h1 class="attract-title"></h1>
            <span class="attract-players"></span>
          </div>
          <div class="attract-prompt"><b>START PLAY</b><small>SHOOT BACK</small></div>
        </div>
      </section>
      <div id="boot-screen" class="boot-screen" role="dialog" aria-modal="true" aria-label="Cabinet boot screen" aria-hidden="true" tabindex="-1">
        <canvas class="boot-canvas" width="1280" height="960"></canvas>
      </div>
      <div class="crt" aria-hidden="true"><i class="crt-roll"></i></div>
    </main>
    <div id="play-layer" aria-hidden="true"></div>
    <script src="games.js"></script>
    <script src="cab.js"></script>
    <script src="themes.js"></script>
    <script src="audio.js"></script>
    <script src="attract.js"></script>
    <script src="pads.js"></script>
    <script src="emulation.js"></script>
    <script src="app.js"></script>
    <script src="vendor/qrcode-generator.js"></script>
    <script src="boot.js"></script>
    <script src="features.js"></script>
  </body>
</html>
