<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rycade Player</title>
  <style>
    *,::before,::after{cursor:none!important}
    html,body,#game{position:fixed;inset:0;width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    #game{overflow:visible}
    #game .ejs_canvas_parent{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;overflow:visible!important}
    #game canvas{position:absolute!important;inset:0!important;margin:auto!important;width:min(100vw,133.333vh)!important;height:min(100vh,75vw)!important;aspect-ratio:4/3;object-fit:contain}
    .ejs_menu_bar,.ejs_bottom_bar,.ejs_start_button,.ejs_fullscreen,.ejs_menu{display:none!important}
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="/profiles.js"></script>
  <script src="/padsplit.js"></script>
  <script src="/play.js"></script>
</body>
</html>
